services:
  # ─────────────────────────────────────────
  # Jarvis Frontend (Nginx serving React build)
  # ─────────────────────────────────────────
  jarvis-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_N8N_WEBHOOK_URL=${VITE_N8N_WEBHOOK_URL:-}
        - VITE_ELEVENLABS_API_KEY=${VITE_ELEVENLABS_API_KEY:-}
        - VITE_ELEVENLABS_VOICE_ID=${VITE_ELEVENLABS_VOICE_ID:-}
        - VITE_HA_URL=${VITE_HA_URL:-${HA_URL:-}}
        - VITE_HA_TOKEN=${VITE_HA_TOKEN:-${HA_TOKEN:-}}
    container_name: jarvis-app
    restart: unless-stopped
    ports:
      - "${JARVIS_PORT:-80}:80"
      - "${JARVIS_SSL_PORT:-443}:443"
    depends_on:
      - jarvis-stats
    networks:
      - jarvis-net

  # ─────────────────────────────────────────
  # Stats Server (reads host CPU/RAM from /proc + Home Assistant proxy)
  # ─────────────────────────────────────────
  jarvis-stats:
    build:
      context: ./stats-server
      dockerfile: Dockerfile
    container_name: jarvis-stats
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount host's /proc so we can read real system stats (Linux / WSL)
      - /proc:/host/proc:ro
      # Mount host project root to dynamically read and write .env
      - ./:/host-project
    environment:
      - HOST_PROC=/host/proc
      - PORT=3001
      - VITE_HA_URL=${VITE_HA_URL:-${HA_URL:-}}
      - VITE_HA_TOKEN=${VITE_HA_TOKEN:-${HA_TOKEN:-}}
      - HA_URL=${HA_URL:-${VITE_HA_URL:-}}
      - HA_TOKEN=${HA_TOKEN:-${VITE_HA_TOKEN:-}}
      - HA_API=${HA_API:-}
      - HA_API_KEY=${HA_API_KEY:-}
      - HOME_ASSISTANT_URL=${HOME_ASSISTANT_URL:-}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN:-}
      - HOME_ASSISTANT_API=${HOME_ASSISTANT_API:-}
      - HOME_ASSISTANT_API_KEY=${HOME_ASSISTANT_API_KEY:-}
      - VITE_N8N_WEBHOOK_URL=${VITE_N8N_WEBHOOK_URL:-}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
    networks:
      - jarvis-net

networks:
  jarvis-net:
    driver: bridge
