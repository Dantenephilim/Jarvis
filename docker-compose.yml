services:
  # ─────────────────────────────────────────
  # Jarvis Frontend (Nginx serving React build)
  # ─────────────────────────────────────────
  jarvis-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_N8N_WEBHOOK_URL=${VITE_N8N_WEBHOOK_URL:-}
        - VITE_ELEVENLABS_API_KEY=${VITE_ELEVENLABS_API_KEY:-}
        - VITE_ELEVENLABS_VOICE_ID=${VITE_ELEVENLABS_VOICE_ID:-}
    container_name: jarvis-app
    restart: unless-stopped
    ports:
      - "${JARVIS_PORT:-80}:80"
    depends_on:
      - jarvis-stats
    networks:
      - jarvis-net

  # ─────────────────────────────────────────
  # Stats Server (reads host CPU/RAM from /proc)
  # ─────────────────────────────────────────
  jarvis-stats:
    build:
      context: ./stats-server
      dockerfile: Dockerfile
    container_name: jarvis-stats
    restart: unless-stopped
    volumes:
      # Mount host's /proc so we can read real system stats (Linux / WSL)
      - /proc:/host/proc:ro
    environment:
      - HOST_PROC=/host/proc
      - PORT=3001
    networks:
      - jarvis-net

networks:
  jarvis-net:
    driver: bridge
